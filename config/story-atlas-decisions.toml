[[decisions]]
plot_id = "01_pacific_evidence_map"
observation = "The corrected Equal Earth map places the reviewed event and all 10 candidate stations without seam-spanning line artifacts, but the event, DART 21418, and nearby labels collide at basin and thumbnail scale."
question = "Is the event and candidate observational chain legible at basin scale?"
follow_up = "Add a reviewed regional inset or small multiple for the crowded Tōhoku cluster while retaining the fixed basin context as diagnostic evidence."
result = "The basin context is spatially usable after the force-over seam fix, but local label crowding prevents treating this rendering as a final story scene."
disposition = "branch"
storyboard_implication = "No scene is promoted; open a later reviewed regional-context branch without changing candidate stations."
manual_qa = "Inspected full size and 400 px thumbnail in color, grayscale, deuteranopia, and protanopia simulations; verified the event at 38.297, 142.373, Hilo at 19.7303, -155.0556, and Valparaíso at -33.02767128, -71.62787275; confirmed zero coastline or contour segments over 2,000 km after the seam fix."

[[decisions]]
plot_id = "02_observation_coverage"
observation = "Saipan and Pago Pago dominate continuity risk: Hilo has 29 of 4,320 strict positions unavailable, Pago Pago has 1,319 of 4,320, and Saipan has 796 of 1,440 plus 120 unsnapped off-grid observations."
question = "Where do distinct availability mechanisms affect the coastal chain?"
follow_up = "Branch to an observability-first candidate story that explains source blanks, absent timestamps, and off-grid samples before any arrival comparison."
result = "The coverage view supports observability as the strongest current story lead; Saipan's 12:07–23:08 UTC observed interval remains visibly open and is not bridged."
disposition = "branch"
storyboard_implication = "No scene is promoted; carry the observability-first candidate into a separate reviewed task while the arrival lane remains gated."
manual_qa = "Inspected full size and 400 px thumbnail in color, grayscale, deuteranopia, and protanopia simulations; reconciled Hilo 99.3287%, Pago Pago 69.4676%, Saipan strict 44.7222% and density 53.0556% to the missingness summary; confirmed distinct observed, source-blank, absent-timestamp, and off-grid encodings."

[[decisions]]
plot_id = "03_station_timeseries"
observation = "All 10 station-local panels expose 24,729 retained numeric points, preserve the long Saipan gap, and keep six coastal raw-level panels separate from four DART residual panels."
question = "Are retained station signals inspectable without hiding gaps or datums?"
follow_up = "Retain this as a diagnostic and investigate visible gaps and source-QC outliers through shared data-quality tasks without comparing panel amplitudes."
result = "The panels are useful at full size and their macro-patterns survive thumbnail and color-vision checks, but local scales and incompatible vertical references prohibit amplitude comparison."
disposition = "retain"
storyboard_implication = "Retain as preliminary diagnostic evidence only; no station, waveform, or scene is promoted."
manual_qa = "Inspected full size and 400 px thumbnail in color, grayscale, deuteranopia, and protanopia simulations; verified point-only rendering with no gap-bridging line, explicit local-scale labels, the open Saipan interval, and separate coastal raw-value versus DART residual semantics."

[[decisions]]
plot_id = "04_distance_contour_diagnostic"
observation = "The six WGS84 range rings remain radial while the nine published contour classes are visibly non-radial across the same Equal Earth projection and extent."
question = "How does geodesic range shape differ from published travel-time contours?"
follow_up = "Retain the shape contrast for the later T-003B gate, where reviewed arrival evidence may test it without assigning a contour or speed-derived arrival to any station."
result = "The non-radial shape contrast is strong enough to retain as a candidate, while kilometres and published hours remain explicitly incompatible quantities."
disposition = "retain"
storyboard_implication = "No scene is promoted; the distance candidate remains pending T-002E and independent T-003B review."
manual_qa = "Inspected full size and 400 px thumbnail in color, grayscale, deuteranopia, and protanopia simulations; verified identical panel projection and extent, six ring labels, published hour labels 1, 3, 6, 9, 12, 15, 18, 21, 24, source parts for hours 1, 6, and 24, and the explicit units-differ and no-speed-conversion warning."
